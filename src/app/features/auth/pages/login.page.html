<div class="page-shell auth-shell">
  <section class="surface login-card" aria-labelledby="login-title">
    <p class="eyebrow">Lokalni pristup</p>
    <h1 id="login-title">Prijava</h1>
    <p>Prijavi se unaprijed definiranim računom i koristi samo izmišljene profile.</p>

    <div class="demo-choices" aria-label="Odaberi račun">
      <button type="button" (click)="useParentDemo()">Roditelj</button>
      <button type="button" (click)="useTherapistDemo()">Terapeut</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>E-pošta</span>
        <input type="email" autocomplete="username" [formControl]="form.controls.email" />
      </label>
      <label>
        <span>Lozinka</span>
        <input
          type="password"
          autocomplete="current-password"
          [formControl]="form.controls.password"
        />
      </label>

      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }

      <button class="button button--primary" type="submit" [disabled]="busy()">
        {{ busy() ? 'Prijava…' : 'Prijavi se' }}
      </button>
    </form>

    <a routerLink="/">← Povratak na naslovnicu</a>
  </section>
</div>
