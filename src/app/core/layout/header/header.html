<header class="site-header">
  <div class="header-inner">
    <a
      class="brand"
      routerLink="/"
      aria-label="Artikulino, povratak na naslovnicu"
      (click)="closeMenu()"
    >
      Artikulino<span aria-hidden="true">●</span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Otvori ili zatvori glavni izbornik"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="toggleMenu()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26">
        <path
          d="M4 7h16M4 12h16M4 17h16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <nav id="main-navigation" aria-label="Glavna navigacija" [class.is-open]="menuOpen()">
      <a
        data-nav="home"
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Naslovnica
      </a>
      <a
        data-nav="games"
        routerLink="/igre"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Igre</a
      >
      @if (!auth.isTherapist()) {
        <a
          data-nav="progress"
          routerLink="/napredak"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          >Napredak</a
        >
      }
      @if (auth.isParent()) {
        <a
          data-nav="profiles"
          routerLink="/profili"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        >
          {{ auth.activeChild()?.displayName || 'Profili' }}
        </a>
      } @else if (auth.isTherapist()) {
        <a
          data-nav="therapist"
          routerLink="/pregled-terapeuta"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        >
          Pregled terapeuta
        </a>
      }
      @if (auth.isAuthenticated()) {
        <button class="logout-button" type="button" (click)="logout()">Odjava</button>
      } @else {
        <a
          data-nav="login"
          routerLink="/prijava"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          >Prijava</a
        >
      }
    </nav>
  </div>
</header>
